<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <!-- Unity's loader does document.querySelector('base').href with no null
         check, so this tag has to exist. "./" resolves to this page's own
         directory, keeping everything on the Pages origin. -->
    <base href="./">
    <title>Unity Web Player | Hollow Knight SilkSong</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="loading-text" style="color: white; font-size: 48px; font-family: cursive; text-align: center; margin-top: 20px;"> LOADING...</div>
    <div id="unity-container">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>

<script>
/*
  The 21 large asset bundles can't be stored in the repo directly - the biggest
  is 481 MB and GitHub caps files at 100 MB - so they ship as WebGL.zip split
  into 100 parts and get unpacked into the Cache API on first load.

  The unpacking is done by range-reading the parts and piping each zip entry
  through DecompressionStream straight into the cache. Nothing large is ever
  held in a JS variable, which is what previously exhausted the tab's memory
  and got the renderer killed (Chrome "Aw, Snap!", error code 9).
*/

const CACHE_NAME = "hksilksongcache-v5";
const ZIP_PARTS = 100;
const ZIP_BASE = "StreamingAssets/aa/WebGL.zip";

/* Pixels the game renders, relative to the canvas. Lower = lighter on the GPU.
   1 also stops Retina/HiDPI screens rendering at 2x (4x the pixels). */
const RENDER_SCALE = 1;

// Where the assets actually live. This is deliberately absolute: the page is
// not always served from the same origin as its assets, and when it isn't,
// relative URLs resolve against whatever host served the page and fetch that
// host's pages instead of the archive. Pointing at this fork rather than
// upstream is what makes the patched 512 MB wasm the one that gets used.
const ASSET_BASE =
  "https://cdn.jsdelivr.net/gh/helloimthesigma-blip/hollow-knight-silksong@master/";

// Unity reads document.querySelector('base').href to find StreamingAssets, so
// setting this fixes asset resolution for the loader and for us at once.
document.querySelector("base").href = ASSET_BASE;

const loadingText = document.querySelector("#loading-text");
const originalFetch = window.fetch.bind(window);

const say = (msg) => { loadingText.textContent = msg; };

/* ================= CACHE ================= */
let cachePromise;
const getCache = () => (cachePromise = cachePromise || caches.open(CACHE_NAME));

/* ================= RUNTIME MEMORY TUNING =================
   Applied by rewriting a response as it is fetched rather than editing the
   file, because jsDelivr serves these with max-age=604800 and an edited copy
   would not reach an existing install for a week. Doing it here also means it
   can be undone by editing this page alone, leaving the unpacked bundles be.

   Add &tune=none to the URL to turn this off without a redeploy. */

const TUNE = new URLSearchParams(location.search).get("tune") || "concurrency";

// Addressables loads this many bundles at once. The default of 3 means up to
// three can be decompressing into the wasm heap at the same time, and the
// largest single bundle here is 481 MB.
const MAX_CONCURRENT_BUNDLE_LOADS = 1;

// Two builds of the same module, differing only in the heap they ask for up
// front: 512 MB growing on demand, or 2688 MB allocated in one go.
//
// Growing a wasm heap can require the old and the new buffer to exist at the
// same time, so stepping from 2.2 GB to 2.6 GB briefly needs ~4.8 GB even
// though the game never uses more than ~2.5. On a machine that cannot spare
// that, the crash lands on the growth step rather than on the actual usage.
// Asking for the whole heap once avoids the doubling completely.
//
// &heap=pre selects it. Default is unchanged, since preallocating fails
// outright on a machine that cannot hand over 2688 MB in a single request.
const PREALLOCATE = new URLSearchParams(location.search).get("heap") === "pre";

// &audio=none swaps the four audio bundles for copies under StreamingAssets/aa/
// silent. Those are the same bundles with every AudioClip's resource pointer
// zeroed and the audio blob emptied - 402 MB becomes 0.78 MB - so Addressables
// still finds every clip and dependency it expects and the bundles load
// normally. Deleting them instead is fatal: a missing bundle fails the whole
// dependency group and the title screen never loads.
// Bump when catalog.bin changes, to get past the CDN's week-long cache.
const CATALOG_VERSION = "2";

const SILENT_AUDIO = new URLSearchParams(location.search).get("audio") === "none";
const AUDIO_BUNDLES = ["packed-audio-hornetmusic", "packed-audio-hornetvoices",
                       "packed-audio-sfx", "packed-audio-voices"];

const LOADED_KEY = "silksong-bundles-loaded";
const loadedBundles = [];

// Heap growth overshoot as a percentage, two digits. The default 20% is what
// took the heap to 512 * 1.2^8 = 2202 MB when the game had asked for somewhere
// between 1835 and 2202.
// The heap growth factor is patched into Build/w-pt.framework.js.unityweb
// itself. It cannot be done from here: Unity loads Build/* through its own
// cache layer over XHR, which never passes through window.fetch.

window.fetch = async function (resource, options) {
  const url = typeof resource === "string" ? resource : resource.url;

  // Unity asks for bundles by their plain filename; serve the unpacked copies.
  if (url && url.includes(".bundle")) {
    const name = url.split("/").pop().split("?")[0];
    if (SILENT_AUDIO && AUDIO_BUNDLES.some(b => name.startsWith(b))) {
      console.log("silent audio: " + name.slice(0, 40));
      return originalFetch("StreamingAssets/aa/silent/" + name);
    }
    const hit = await (await getCache()).match(name);
    if (hit) {
      // Every bundle Unity loads passes through here. Recording them says
      // whether it is pulling in the whole 2371 MB of content at startup - in
      // which case cutting unused bundles would help - or only a few, in which
      // case the memory is going somewhere else and cutting would not.
      loadedBundles.push(name);
      try { localStorage.setItem(LOADED_KEY, JSON.stringify(loadedBundles)); } catch (e) {}
      console.log(`bundle ${loadedBundles.length}: ${name}`);
      return hit;
    }
  }

  if (TUNE === "concurrency" && url && url.endsWith("settings.json")) {
    const r = await originalFetch(resource, options);
    if (!r.ok) return r;
    const cfg = await r.json();
    cfg.m_maxConcurrentWebRequests = MAX_CONCURRENT_BUNDLE_LOADS;

    // catalog.bin is served with max-age=604800, so an edited copy would not
    // reach a browser that already has one for a week. Addressables builds the
    // catalog URL from this field, so pointing it somewhere new fetches afresh.
    for (const loc of cfg.m_CatalogLocations || []) {
      if (typeof loc.m_InternalId === "string" && loc.m_InternalId.includes("catalog.bin")) {
        loc.m_InternalId += "?cv=" + CATALOG_VERSION;
      }
    }
    const body = new TextEncoder().encode(JSON.stringify(cfg));
    console.log(`Addressables concurrency set to ${MAX_CONCURRENT_BUNDLE_LOADS}`);
    // Unity reads Content-Length off these responses and stalls its progress
    // accounting when it is missing, so set it rather than letting it default.
    return new Response(body, {
      headers: {
        "content-type": "application/json",
        "content-length": String(body.byteLength),
      },
    });
  }

  return originalFetch(resource, options);
};

async function isUnpacked() {
  return !!(await (await getCache()).match("CACHE_COMPLETE"));
}

async function dropOldCaches() {
  for (const name of await caches.keys()) {
    if (name.includes("hksilksong") && name !== CACHE_NAME) {
      console.log("Deleting old cache:", name);
      await caches.delete(name);
    }
  }
}

/* ================= ZIP =================
   The archive is read as one forward pass over the 100 parts, parsing local
   file headers as they go by and piping each entry straight into the cache.

   Nothing is ever assembled or seeked. An earlier version downloaded every
   part into Blobs, concatenated them and read the central directory off the
   end, which meant holding a ~2 GB Blob - more than Chrome's blob storage
   would give up on a machine short of disk, and the archive then read back
   empty. Every local header here carries its compressed size and none use a
   data descriptor, so a single pass is enough. */

const u16 = (b, o) => b[o] | (b[o + 1] << 8);
const u32 = (b, o) => (b[o] | (b[o + 1] << 8) | (b[o + 2] << 16)) + b[o + 3] * 0x1000000;

const SIG_LOCAL   = 0x04034b50;  // start of a file entry
const SIG_CENTRAL = 0x02014b50;  // start of the central directory = end of data

/* The 100 parts as one continuous stream of chunks. */
async function* archiveChunks(onPart, info) {
  for (let i = 1; i <= ZIP_PARTS; i++) {
    onPart(i);
    let res = null, lastErr = "";
    // cache: no-store keeps Chrome's HTTP cache out of it; on a machine low on
    // disk it can hand back a truncated entry.
    for (let attempt = 1; attempt <= 3 && !res; attempt++) {
      try {
        const r = await originalFetch(`${ZIP_BASE}.part${i}`, { cache: "no-store" });
        if (r.ok) res = r; else lastErr = `HTTP ${r.status}`;
        info.url = r.url;
        info.status = r.status;
        info.type = r.headers.get("content-type");
        info.length = r.headers.get("content-length");
      } catch (e) { lastErr = e.message; }
    }
    if (!res) throw new Error(`part${i} failed after 3 tries: ${lastErr}`);

    const reader = res.body.getReader();
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      yield value;
    }
  }
}

/* Sequential reader over those chunks. */
class ByteSource {
  constructor(gen) { this.gen = gen; this.buf = null; this.pos = 0; this.read = 0; }

  async take(max) {
    while (!this.buf || this.pos >= this.buf.length) {
      const { value, done } = await this.gen.next();
      if (done) return null;
      this.buf = value; this.pos = 0;
    }
    const n = Math.min(max, this.buf.length - this.pos);
    const out = this.buf.slice(this.pos, this.pos + n);
    this.pos += n;
    this.read += n;
    return out;
  }

  async exactly(n) {
    const out = new Uint8Array(n);
    let w = 0;
    while (w < n) {
      const c = await this.take(n - w);
      if (!c) throw new Error(`archive ended early: wanted ${n} bytes, got ${w}`);
      out.set(c, w); w += c.length;
    }
    return out;
  }

  /* Exactly n bytes, as a stream, so an entry never lands in a variable. */
  stream(n) {
    let left = n;
    const src = this;
    return new ReadableStream({
      async pull(controller) {
        if (left === 0) { controller.close(); return; }
        const chunk = await src.take(Math.min(left, 1 << 20));
        if (!chunk) { controller.error(new Error("archive ended mid-entry")); return; }
        left -= chunk.length;
        controller.enqueue(chunk);
      },
    });
  }
}

/* ================= UNPACK ================= */
async function unpack() {
  if (typeof DecompressionStream === "undefined") {
    throw new Error("This browser is too old - needs Chrome 103+ for DecompressionStream");
  }

  const cache = await getCache();

  // Chrome streams a Response body straight into cache storage. If this build
  // won't, entries have to be buffered instead, so find out once up front.
  let canStreamPut = true;
  try {
    await cache.put("__probe", new Response(new Blob(["x"]).stream()));
    await cache.delete("__probe");
  } catch (e) {
    canStreamPut = false;
    console.warn("streamed cache.put unavailable, buffering entries instead", e);
  }

  let part = 0, shownMB = -1, count = 0;
  const info = {};
  const src = new ByteSource(archiveChunks((i) => { part = i; }, info));

  const tick = () => {
    const mb = Math.floor(src.read / 1048576);
    if (mb !== shownMB) {
      shownMB = mb;
      say(`UNPACKING ${mb} MB - part ${part}/${ZIP_PARTS}, ${count} bundles`);
    }
  };

  for (;;) {
    const head = await src.exactly(4);
    const sig = u32(head, 0);
    if (sig === SIG_CENTRAL) break;      // reached the directory: all entries done
    if (sig !== SIG_LOCAL) {
      // Show what actually arrived - a wrong signature almost always means the
      // fetch returned something other than the archive, e.g. an error page.
      const extra = await src.take(60);
      const seen = new Uint8Array([...head, ...(extra || [])]);
      const hex = [...seen].map(b => b.toString(16).padStart(2, "0")).join(" ");
      const txt = [...seen].map(b => (b >= 32 && b < 127 ? String.fromCharCode(b) : ".")).join("");
      throw new Error(
        `unexpected signature 0x${sig.toString(16)} after ${count} bundles, ${src.read} bytes\n` +
        `fetched: ${info.url}\n` +
        `status ${info.status}, type ${info.type}, length ${info.length}\n` +
        `hex:  ${hex}\n` +
        `text: ${txt}`
      );
    }

    const h = await src.exactly(26);     // rest of the local file header
    const method = u16(h, 4);
    const csize  = u32(h, 14);
    const nlen   = u16(h, 22);
    const elen   = u16(h, 24);
    const name   = new TextDecoder().decode(await src.exactly(nlen));
    if (elen) await src.exactly(elen);

    if (method !== 8 && method !== 0) throw new Error(`unsupported zip method ${method} for ${name}`);

    const counter = new TransformStream({
      transform(chunk, controller) { tick(); controller.enqueue(chunk); },
    });
    const raw = src.stream(csize);
    const body = (method === 8
      ? raw.pipeThrough(new DecompressionStream("deflate-raw"))
      : raw).pipeThrough(counter);

    if (canStreamPut) {
      await cache.put(name, new Response(body));
    } else {
      await cache.put(name, new Response(await new Response(body).blob()));
    }

    count++;
    tick();
  }

  if (count === 0) throw new Error("archive contained no entries");

  await cache.put("CACHE_COMPLETE", new Response("ok"));
  console.log(`Unpack complete: ${count} bundles, ${src.read} bytes read`);
}

/* ================= HEAP TELEMETRY =================
   The tab dies before anything can be read off the console, so the peak is
   written to localStorage as it climbs and reported on the next load. This is
   the number that says whether the heap can be tuned into range at all, or
   whether the machine simply does not have the memory. */

const HEAP_PEAK_KEY = "silksong-heap-peak-mb";

function reportLastRun() {
  const last = localStorage.getItem(HEAP_PEAK_KEY);
  if (last) {
    console.log(`Previous run reached a ${last} MB wasm heap before stopping.`);
  }
  try {
    const prev = JSON.parse(localStorage.getItem(LOADED_KEY) || "[]");
    if (prev.length) {
      console.log(`Previous run loaded ${prev.length} bundles before stopping:`);
      console.log(prev.join("\n"));
    }
  } catch (e) { /* nothing useful to report */ }
  if (navigator.deviceMemory) {
    console.log(`This device reports roughly ${navigator.deviceMemory} GB of RAM.`);
  }
}

function watchHeap(instance) {
  const readout = document.createElement("div");
  readout.style.cssText =
    "position:fixed;top:4px;right:6px;z-index:99;font:12px monospace;" +
    "color:#8f8;background:rgba(0,0,0,.55);padding:2px 6px;border-radius:3px";
  document.body.appendChild(readout);

  let peak = 0;
  setInterval(() => {
    const heap = instance?.Module?.HEAPU8?.length;
    if (!heap) return;
    const mb = Math.round(heap / 1048576);
    if (mb > peak) {
      peak = mb;
      localStorage.setItem(HEAP_PEAK_KEY, String(peak));
    }
    readout.textContent = `heap ${mb} MB (peak ${peak})`;
  }, 500);
}

/* ================= UNITY ================= */
function startUnity() {
  const canvas = document.querySelector("#unity-canvas");
  const loadingBar = document.querySelector("#unity-loading-bar");
  const progressBarFull = document.querySelector("#unity-progress-bar-full");
  const warningBanner = document.querySelector("#unity-warning");

  function unityShowBanner(msg, type) {
    function update() {
      warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
    }
    let div = document.createElement('div');
    div.innerHTML = msg;
    warningBanner.appendChild(div);
    if (type == 'error') {
      div.style = 'background:red;padding:10px;';
    } else {
      if (type == 'warning') {
        div.style = 'background:yellow;padding:10px;';
      }
      setTimeout(() => { warningBanner.removeChild(div); update(); }, 5000);
    }
    update();
  }

  const buildUrl = "Build";
  const config = {
    dataUrl: buildUrl + "/w-pt.data.unityweb",
    frameworkUrl: buildUrl + "/w-pt.framework.js.unityweb?fwv=2",
    codeUrl: buildUrl + (PREALLOCATE ? "/w-pt.wasm.pre.unityweb" : "/w-pt.wasm.unityweb"),
    streamingAssetsUrl: "StreamingAssets",
    companyName: "EDUrocks Group, Truffled, GN-Math",
    productName: "Hollow Knight SilkSong",
    productVersion: "1.0",
    showBanner: unityShowBanner,
    devicePixelRatio: RENDER_SCALE,
  };

  loadingBar.style.display = "block";

  const script = document.createElement("script");
  script.src = buildUrl + "/w-pt.loader.js";
  script.onload = () => {
    createUnityInstance(canvas, config, (progress) => {
      progressBarFull.style.width = (progress * 100) + "%";
      say("LOADING... " + Math.round(progress * 100) + "%");
    })
      .then((instance) => { loadingBar.remove(); loadingText.remove(); watchHeap(instance); })
      .catch((err) => { console.error(err); say("ERROR: " + err); });
  };
  script.onerror = () => say("ERROR: could not load " + script.src);
  document.body.appendChild(script);
}

/* ================= MAIN ================= */
(async () => {
  try {
    reportLastRun();
    await dropOldCaches();

    // Ask Chrome not to evict the unpacked bundles under storage pressure -
    // otherwise a cleanup could force the whole 2.4 GB unpack to run again.
    if (typeof navigator !== "undefined" && navigator.storage && navigator.storage.persist) {
      try { await navigator.storage.persist(); } catch (e) { /* best effort */ }
    }

    if (await isUnpacked()) {
      say("LOADING FROM CACHE...");
    } else {
      await unpack();
    }
    say("STARTING GAME...");
    startUnity();
  } catch (err) {
    console.error(err);
    // multi-line diagnostics need to be legible at 48px cursive
    loadingText.style.fontSize = "15px";
    loadingText.style.fontFamily = "monospace";
    loadingText.style.whiteSpace = "pre-wrap";
    loadingText.style.textAlign = "left";
    say("ERROR: " + err.message);
  }
})();
</script>
  </body>
</html>
