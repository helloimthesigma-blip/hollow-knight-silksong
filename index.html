<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <!-- Unity's loader does document.querySelector('base').href with no null
         check, so this tag has to exist. "./" resolves to this page's own
         directory, keeping everything on the Pages origin. -->
    <base href="./">
    <title>Unity Web Player | Hollow Knight SilkSong</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="loading-text" style="color: white; font-size: 48px; font-family: cursive; text-align: center; margin-top: 20px;"> LOADING...</div>
    <div id="unity-container">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>

<script>
/*
  The 21 large asset bundles can't be stored in the repo directly - the biggest
  is 481 MB and GitHub caps files at 100 MB - so they ship as WebGL.zip split
  into 100 parts and get unpacked into the Cache API on first load.

  The unpacking is done by range-reading the parts and piping each zip entry
  through DecompressionStream straight into the cache. Nothing large is ever
  held in a JS variable, which is what previously exhausted the tab's memory
  and got the renderer killed (Chrome "Aw, Snap!", error code 9).
*/

const CACHE_NAME = "hksilksongcache-v4";
const ZIP_PARTS = 100;
const ZIP_BASE = "StreamingAssets/aa/WebGL.zip";

/* Pixels the game renders, relative to the canvas. Lower = lighter on the GPU.
   1 also stops Retina/HiDPI screens rendering at 2x (4x the pixels). */
const RENDER_SCALE = 1;

const loadingText = document.querySelector("#loading-text");
const originalFetch = window.fetch.bind(window);

const say = (msg) => { loadingText.textContent = msg; };

/* ================= CACHE ================= */
let cachePromise;
const getCache = () => (cachePromise = cachePromise || caches.open(CACHE_NAME));

/* Unity asks for bundles by their plain filename; serve the unpacked copies. */
window.fetch = async function (resource, options) {
  const url = typeof resource === "string" ? resource : resource.url;
  if (url && url.includes(".bundle")) {
    const name = url.split("/").pop().split("?")[0];
    const hit = await (await getCache()).match(name);
    if (hit) return hit;
  }
  return originalFetch(resource, options);
};

async function isUnpacked() {
  return !!(await (await getCache()).match("CACHE_COMPLETE"));
}

async function dropOldCaches() {
  for (const name of await caches.keys()) {
    if (name.includes("hksilksong") && name !== CACHE_NAME) {
      console.log("Deleting old cache:", name);
      await caches.delete(name);
    }
  }
}

/* ================= ZIP =================
   GitHub Pages re-compresses these files for any browser (which always sends
   Accept-Encoding: gzip), so Content-Length and Range offsets both describe
   the *compressed* stream while fetch hands back decompressed bytes. Byte
   ranges are therefore meaningless over the network, and Accept-Encoding is a
   forbidden header so it can't be turned off.

   Instead each part is downloaded whole into a Blob. Chrome keeps Blobs in its
   own storage rather than the JS heap, so this stays cheap, and slicing a Blob
   is a local operation with none of the header trouble. */
async function downloadZip() {
  const parts = [], sizes = [];
  let bytes = 0;

  for (let i = 1; i <= ZIP_PARTS; i++) {
    let blob = null, lastErr = "";
    // cache: no-store keeps Chrome's HTTP cache out of it. On a machine that
    // is low on disk the cache can hand back a truncated entry, which shows up
    // much later as an unreadable archive.
    for (let attempt = 1; attempt <= 3 && !blob; attempt++) {
      try {
        const r = await originalFetch(`${ZIP_BASE}.part${i}`, { cache: "no-store" });
        if (!r.ok) { lastErr = `HTTP ${r.status}`; continue; }
        const b = await r.blob();
        if (b.size === 0) { lastErr = "empty response"; continue; }
        blob = b;
      } catch (e) {
        lastErr = e.message;
      }
    }
    if (!blob) throw new Error(`part${i} failed after 3 tries: ${lastErr}`);

    parts.push(blob);
    sizes.push(blob.size);
    bytes += blob.size;
    say(`DOWNLOADING ASSETS... ${(bytes / 1048576).toFixed(0)} MB (${i}/${ZIP_PARTS})`);
  }

  const zip = new Blob(parts);
  if (zip.size !== bytes) {
    throw new Error(`assembled archive is ${zip.size} bytes but parts totalled ${bytes}`);
  }
  return { zip, sizes };
}

/* Only called when the archive turns out to be unreadable, to say why. */
async function describeArchive(zip, sizes) {
  const lines = [];
  lines.push(`archive ${zip.size} bytes from ${sizes.length} parts`);

  // parts 1..n-1 are produced at a fixed size, so any odd one out is suspect
  const counts = {};
  sizes.slice(0, -1).forEach(s => counts[s] = (counts[s] || 0) + 1);
  const usual = +Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
  const odd = sizes.map((s, i) => [i + 1, s])
                   .filter(([i, s]) => i < sizes.length && s !== usual);
  lines.push(`usual part size ${usual}`);
  lines.push(odd.length ? `WRONG SIZE: ${odd.map(([i, s]) => `part${i}=${s}`).join(", ")}`
                        : "all parts the expected size");

  try {
    const { usage, quota } = await navigator.storage.estimate();
    lines.push(`storage ${(usage / 1073741824).toFixed(2)} GB used of ${(quota / 1073741824).toFixed(2)} GB`);
  } catch (e) { /* not fatal */ }

  try {
    const tail = new Uint8Array(await zip.slice(zip.size - 32, zip.size).arrayBuffer());
    lines.push(`last 32 bytes: ${[...tail].map(b => b.toString(16).padStart(2, "0")).join("")}`);
  } catch (e) {
    lines.push(`could not read the end of the archive: ${e.message}`);
  }

  return lines.join("\n");
}

const u16 = (b, o) => b[o] | (b[o + 1] << 8);
const u32 = (b, o) => (b[o] | (b[o + 1] << 8) | (b[o + 2] << 16)) + b[o + 3] * 0x1000000;

const readBytes = async (blob, start, end) =>
  new Uint8Array(await blob.slice(start, end).arrayBuffer());

async function readEntries(zip) {
  const tailLen = Math.min(65557, zip.size);
  const tail = await readBytes(zip, zip.size - tailLen, zip.size);

  let eocd = -1;
  for (let i = tail.length - 22; i >= 0; i--) {
    if (u32(tail, i) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error("EOCD_NOT_FOUND");

  const count = u16(tail, eocd + 10);
  const cdOff = u32(tail, eocd + 16);
  const cd = await readBytes(zip, cdOff, cdOff + u32(tail, eocd + 12));

  const entries = [];
  let p = 0;
  for (let i = 0; i < count; i++) {
    if (u32(cd, p) !== 0x02014b50) throw new Error("bad central directory entry");
    const nlen = u16(cd, p + 28), elen = u16(cd, p + 30), clen = u16(cd, p + 32);
    entries.push({
      method: u16(cd, p + 10),
      csize: u32(cd, p + 20),
      usize: u32(cd, p + 24),
      lho: u32(cd, p + 42),
      name: new TextDecoder().decode(cd.subarray(p + 46, p + 46 + nlen)),
    });
    p += 46 + nlen + elen + clen;
  }
  return entries;
}

/* ================= UNPACK ================= */
async function unpack() {
  if (typeof DecompressionStream === "undefined") {
    throw new Error("This browser is too old - needs Chrome 103+ for DecompressionStream");
  }

  const { zip, sizes } = await downloadZip();

  say("READING ASSET INDEX...");
  let entries;
  try {
    entries = await readEntries(zip);
  } catch (err) {
    const detail = await describeArchive(zip, sizes);
    console.error("archive unreadable:\n" + detail);
    throw new Error(`${err.message}\n${detail}`);
  }
  const cache = await getCache();

  const totalMB = (entries.reduce((n, e) => n + e.usize, 0) / 1048576).toFixed(0);
  let doneBytes = 0, shownMB = -1;

  // Unpacking writes a couple of GB to disk and the biggest single bundle is
  // ~481 MB, so without a byte counter one label can sit there for minutes and
  // look like a hang.
  const counter = () => new TransformStream({
    transform(chunk, controller) {
      doneBytes += chunk.byteLength;
      const mb = Math.floor(doneBytes / 1048576);
      if (mb !== shownMB) {
        shownMB = mb;
        say(`UNPACKING ${mb} / ${totalMB} MB`);
      }
      controller.enqueue(chunk);
    },
  });

  for (let i = 0; i < entries.length; i++) {
    const e = entries[i];
    if (e.method !== 8 && e.method !== 0) {
      throw new Error(`unsupported zip method ${e.method}`);
    }

    // The local header repeats the name/extra fields, so the payload offset
    // has to be read from it rather than assumed.
    const lh = await readBytes(zip, e.lho, e.lho + 30);
    if (u32(lh, 0) !== 0x04034b50) throw new Error(`bad local header for ${e.name}`);
    const dataStart = e.lho + 30 + u16(lh, 26) + u16(lh, 28);

    // Built fresh per attempt: a stream can only be consumed once, and
    // teeing one with clone() would buffer the whole entry in memory.
    const openStream = () => {
      const s = zip.slice(dataStart, dataStart + e.csize).stream();
      return (e.method === 8
        ? s.pipeThrough(new DecompressionStream("deflate-raw"))
        : s).pipeThrough(counter());
    };

    const startedAt = doneBytes;
    try {
      // Streams into cache storage; nothing buffers in the JS heap.
      await cache.put(e.name, new Response(openStream()));
    } catch (err) {
      // Older Chrome refuses streamed bodies in Cache.put - fall back to a
      // Blob, which Chrome keeps on disk rather than in the heap.
      console.warn("streamed cache.put failed, using blob:", err);
      doneBytes = startedAt;
      await cache.put(e.name, new Response(await new Response(openStream()).blob()));
    }
  }

  await cache.put("CACHE_COMPLETE", new Response("ok"));
  console.log("Unpack complete");
}

/* ================= UNITY ================= */
function startUnity() {
  const canvas = document.querySelector("#unity-canvas");
  const loadingBar = document.querySelector("#unity-loading-bar");
  const progressBarFull = document.querySelector("#unity-progress-bar-full");
  const warningBanner = document.querySelector("#unity-warning");

  function unityShowBanner(msg, type) {
    function update() {
      warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
    }
    let div = document.createElement('div');
    div.innerHTML = msg;
    warningBanner.appendChild(div);
    if (type == 'error') {
      div.style = 'background:red;padding:10px;';
    } else {
      if (type == 'warning') {
        div.style = 'background:yellow;padding:10px;';
      }
      setTimeout(() => { warningBanner.removeChild(div); update(); }, 5000);
    }
    update();
  }

  const buildUrl = "Build";
  const config = {
    dataUrl: buildUrl + "/w-pt.data.unityweb",
    frameworkUrl: buildUrl + "/w-pt.framework.js.unityweb",
    codeUrl: buildUrl + "/w-pt.wasm.unityweb",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "EDUrocks Group, Truffled, GN-Math",
    productName: "Hollow Knight SilkSong",
    productVersion: "1.0",
    showBanner: unityShowBanner,
    devicePixelRatio: RENDER_SCALE,
  };

  loadingBar.style.display = "block";

  const script = document.createElement("script");
  script.src = buildUrl + "/w-pt.loader.js";
  script.onload = () => {
    createUnityInstance(canvas, config, (progress) => {
      progressBarFull.style.width = (progress * 100) + "%";
      say("LOADING... " + Math.round(progress * 100) + "%");
    })
      .then(() => { loadingBar.remove(); loadingText.remove(); })
      .catch((err) => { console.error(err); say("ERROR: " + err); });
  };
  script.onerror = () => say("ERROR: could not load " + script.src);
  document.body.appendChild(script);
}

/* ================= MAIN ================= */
(async () => {
  try {
    await dropOldCaches();

    // Ask Chrome not to evict the unpacked bundles under storage pressure -
    // otherwise a cleanup could force the whole 2.4 GB unpack to run again.
    if (typeof navigator !== "undefined" && navigator.storage && navigator.storage.persist) {
      try { await navigator.storage.persist(); } catch (e) { /* best effort */ }
    }

    if (await isUnpacked()) {
      say("LOADING FROM CACHE...");
    } else {
      await unpack();
    }
    say("STARTING GAME...");
    startUnity();
  } catch (err) {
    console.error(err);
    // multi-line diagnostics need to be legible at 48px cursive
    loadingText.style.fontSize = "15px";
    loadingText.style.fontFamily = "monospace";
    loadingText.style.whiteSpace = "pre-wrap";
    loadingText.style.textAlign = "left";
    say("ERROR: " + err.message);
  }
})();
</script>
  </body>
</html>
