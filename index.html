<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <!-- Unity's loader does document.querySelector('base').href with no null
         check, so this tag has to exist. "./" resolves to this page's own
         directory, keeping everything on the Pages origin. -->
    <base href="./">
    <title>Unity Web Player | Hollow Knight SilkSong</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="loading-text" style="color: white; font-size: 48px; font-family: cursive; text-align: center; margin-top: 20px;"> LOADING...</div>
    <div id="unity-container">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>

<script>
/*
  The 21 large asset bundles can't be stored in the repo directly - the biggest
  is 481 MB and GitHub caps files at 100 MB - so they ship as WebGL.zip split
  into 100 parts and get unpacked into the Cache API on first load.

  The unpacking is done by range-reading the parts and piping each zip entry
  through DecompressionStream straight into the cache. Nothing large is ever
  held in a JS variable, which is what previously exhausted the tab's memory
  and got the renderer killed (Chrome "Aw, Snap!", error code 9).
*/

const CACHE_NAME = "hksilksongcache-v5";
const ZIP_PARTS = 100;
const ZIP_BASE = "StreamingAssets/aa/WebGL.zip";

/* Pixels the game renders, relative to the canvas. Lower = lighter on the GPU.
   1 also stops Retina/HiDPI screens rendering at 2x (4x the pixels). */
const RENDER_SCALE = 1;

// Where the assets actually live. This is deliberately absolute: the page is
// not always served from the same origin as its assets, and when it isn't,
// relative URLs resolve against whatever host served the page and fetch that
// host's pages instead of the archive. Pointing at this fork rather than
// upstream is what makes the patched 512 MB wasm the one that gets used.
const ASSET_BASE =
  "https://cdn.jsdelivr.net/gh/helloimthesigma-blip/hollow-knight-silksong@master/";

// Unity reads document.querySelector('base').href to find StreamingAssets, so
// setting this fixes asset resolution for the loader and for us at once.
document.querySelector("base").href = ASSET_BASE;

const loadingText = document.querySelector("#loading-text");
const originalFetch = window.fetch.bind(window);

const say = (msg) => { loadingText.textContent = msg; };

/* ================= CACHE ================= */
let cachePromise;
const getCache = () => (cachePromise = cachePromise || caches.open(CACHE_NAME));

/* Unity asks for bundles by their plain filename; serve the unpacked copies. */
window.fetch = async function (resource, options) {
  const url = typeof resource === "string" ? resource : resource.url;
  if (url && url.includes(".bundle")) {
    const name = url.split("/").pop().split("?")[0];
    const hit = await (await getCache()).match(name);
    if (hit) return hit;
  }
  return originalFetch(resource, options);
};

async function isUnpacked() {
  return !!(await (await getCache()).match("CACHE_COMPLETE"));
}

async function dropOldCaches() {
  for (const name of await caches.keys()) {
    if (name.includes("hksilksong") && name !== CACHE_NAME) {
      console.log("Deleting old cache:", name);
      await caches.delete(name);
    }
  }
}

/* ================= ZIP =================
   The archive is read as one forward pass over the 100 parts, parsing local
   file headers as they go by and piping each entry straight into the cache.

   Nothing is ever assembled or seeked. An earlier version downloaded every
   part into Blobs, concatenated them and read the central directory off the
   end, which meant holding a ~2 GB Blob - more than Chrome's blob storage
   would give up on a machine short of disk, and the archive then read back
   empty. Every local header here carries its compressed size and none use a
   data descriptor, so a single pass is enough. */

const u16 = (b, o) => b[o] | (b[o + 1] << 8);
const u32 = (b, o) => (b[o] | (b[o + 1] << 8) | (b[o + 2] << 16)) + b[o + 3] * 0x1000000;

const SIG_LOCAL   = 0x04034b50;  // start of a file entry
const SIG_CENTRAL = 0x02014b50;  // start of the central directory = end of data

/* The 100 parts as one continuous stream of chunks. */
async function* archiveChunks(onPart, info) {
  for (let i = 1; i <= ZIP_PARTS; i++) {
    onPart(i);
    let consumed = 0;   // bytes of this part already handed out

    for (let attempt = 1; ; attempt++) {
      let res = null, lastErr = "";
      // cache: no-store keeps Chrome's HTTP cache out of it; on a machine low
      // on disk it can hand back a truncated entry.
      try {
        const r = await originalFetch(`${ZIP_BASE}.part${i}`, { cache: "no-store" });
        info.url = r.url;
        info.status = r.status;
        info.type = r.headers.get("content-type");
        info.length = r.headers.get("content-length");
        if (r.ok) res = r; else lastErr = `HTTP ${r.status}`;
      } catch (e) {
        lastErr = e.message;
      }

      if (res) {
        try {
          const reader = res.body.getReader();
          let skip = consumed;    // on a retry, drop what was already yielded
          for (;;) {
            const { done, value } = await reader.read();
            if (done) break;
            if (skip >= value.length) { skip -= value.length; continue; }
            const chunk = skip ? value.subarray(skip) : value;
            skip = 0;
            consumed += chunk.length;
            yield chunk;
          }
          break;              // part delivered in full
        } catch (e) {
          // The connection dropped mid-part. Refetch and resume rather than
          // failing the whole unpack - the stream feeds straight into
          // Cache.put, which reports a broken body as a network error.
          lastErr = e.message;
          console.warn(`part${i} interrupted at byte ${consumed}, retrying`);
        }
      }

      if (attempt >= 4) {
        throw new Error(`part${i} failed after ${attempt} tries at byte ${consumed}: ${lastErr}`);
      }
      await new Promise(r => setTimeout(r, 500 * attempt));
    }
  }
}

/* Sequential reader over those chunks. */
class ByteSource {
  constructor(gen) { this.gen = gen; this.buf = null; this.pos = 0; this.read = 0; }

  async take(max) {
    while (!this.buf || this.pos >= this.buf.length) {
      const { value, done } = await this.gen.next();
      if (done) return null;
      this.buf = value; this.pos = 0;
    }
    const n = Math.min(max, this.buf.length - this.pos);
    const out = this.buf.slice(this.pos, this.pos + n);
    this.pos += n;
    this.read += n;
    return out;
  }

  async exactly(n) {
    const out = new Uint8Array(n);
    let w = 0;
    while (w < n) {
      const c = await this.take(n - w);
      if (!c) throw new Error(`archive ended early: wanted ${n} bytes, got ${w}`);
      out.set(c, w); w += c.length;
    }
    return out;
  }

  /* Exactly n bytes, as a stream, so an entry never lands in a variable. */
  stream(n) {
    let left = n;
    const src = this;
    return new ReadableStream({
      async pull(controller) {
        if (left === 0) { controller.close(); return; }
        const chunk = await src.take(Math.min(left, 1 << 20));
        if (!chunk) { controller.error(new Error("archive ended mid-entry")); return; }
        left -= chunk.length;
        controller.enqueue(chunk);
      },
    });
  }
}

/* ================= UNPACK ================= */
async function unpack() {
  if (typeof DecompressionStream === "undefined") {
    throw new Error("This browser is too old - needs Chrome 103+ for DecompressionStream");
  }

  const cache = await getCache();

  // Chrome streams a Response body straight into cache storage. If this build
  // won't, entries have to be buffered instead, so find out once up front.
  let canStreamPut = true;
  try {
    await cache.put("__probe", new Response(new Blob(["x"]).stream()));
    await cache.delete("__probe");
  } catch (e) {
    canStreamPut = false;
    console.warn("streamed cache.put unavailable, buffering entries instead", e);
  }

  let part = 0, shownMB = -1, count = 0;
  const info = {};
  const src = new ByteSource(archiveChunks((i) => { part = i; }, info));

  const tick = () => {
    const mb = Math.floor(src.read / 1048576);
    if (mb !== shownMB) {
      shownMB = mb;
      say(`UNPACKING ${mb} MB - part ${part}/${ZIP_PARTS}, ${count} bundles`);
    }
  };

  for (;;) {
    const head = await src.exactly(4);
    const sig = u32(head, 0);
    if (sig === SIG_CENTRAL) break;      // reached the directory: all entries done
    if (sig !== SIG_LOCAL) {
      // Show what actually arrived - a wrong signature almost always means the
      // fetch returned something other than the archive, e.g. an error page.
      const extra = await src.take(60);
      const seen = new Uint8Array([...head, ...(extra || [])]);
      const hex = [...seen].map(b => b.toString(16).padStart(2, "0")).join(" ");
      const txt = [...seen].map(b => (b >= 32 && b < 127 ? String.fromCharCode(b) : ".")).join("");
      throw new Error(
        `unexpected signature 0x${sig.toString(16)} after ${count} bundles, ${src.read} bytes\n` +
        `fetched: ${info.url}\n` +
        `status ${info.status}, type ${info.type}, length ${info.length}\n` +
        `hex:  ${hex}\n` +
        `text: ${txt}`
      );
    }

    const h = await src.exactly(26);     // rest of the local file header
    const method = u16(h, 4);
    const csize  = u32(h, 14);
    const nlen   = u16(h, 22);
    const elen   = u16(h, 24);
    const name   = new TextDecoder().decode(await src.exactly(nlen));
    if (elen) await src.exactly(elen);

    if (method !== 8 && method !== 0) throw new Error(`unsupported zip method ${method} for ${name}`);

    const counter = new TransformStream({
      transform(chunk, controller) { tick(); controller.enqueue(chunk); },
    });
    const raw = src.stream(csize);
    const body = (method === 8
      ? raw.pipeThrough(new DecompressionStream("deflate-raw"))
      : raw).pipeThrough(counter);

    try {
      if (canStreamPut) {
        await cache.put(name, new Response(body));
      } else {
        await cache.put(name, new Response(await new Response(body).blob()));
      }
    } catch (err) {
      // Cache.put reports both a broken body and a full disk, so include the
      // storage figures to tell them apart.
      let where = "";
      try {
        const { usage, quota } = await navigator.storage.estimate();
        where = `\nstorage ${(usage / 1073741824).toFixed(2)} GB used of ` +
                `${(quota / 1073741824).toFixed(2)} GB available`;
      } catch (e) { /* not reportable */ }
      throw new Error(`${err.message}\nwhile writing ${name}${where}`);
    }

    count++;
    tick();
  }

  if (count === 0) throw new Error("archive contained no entries");

  await cache.put("CACHE_COMPLETE", new Response("ok"));
  console.log(`Unpack complete: ${count} bundles, ${src.read} bytes read`);
}

/* ================= UNITY ================= */
function startUnity() {
  const canvas = document.querySelector("#unity-canvas");
  const loadingBar = document.querySelector("#unity-loading-bar");
  const progressBarFull = document.querySelector("#unity-progress-bar-full");
  const warningBanner = document.querySelector("#unity-warning");

  function unityShowBanner(msg, type) {
    function update() {
      warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
    }
    let div = document.createElement('div');
    div.innerHTML = msg;
    warningBanner.appendChild(div);
    if (type == 'error') {
      div.style = 'background:red;padding:10px;';
    } else {
      if (type == 'warning') {
        div.style = 'background:yellow;padding:10px;';
      }
      setTimeout(() => { warningBanner.removeChild(div); update(); }, 5000);
    }
    update();
  }

  const buildUrl = "Build";
  const config = {
    dataUrl: buildUrl + "/w-pt.data.unityweb",
    frameworkUrl: buildUrl + "/w-pt.framework.js.unityweb",
    codeUrl: buildUrl + "/w-pt.wasm.unityweb",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "EDUrocks Group, Truffled, GN-Math",
    productName: "Hollow Knight SilkSong",
    productVersion: "1.0",
    showBanner: unityShowBanner,
    devicePixelRatio: RENDER_SCALE,
  };

  loadingBar.style.display = "block";

  const script = document.createElement("script");
  script.src = buildUrl + "/w-pt.loader.js";
  script.onload = () => {
    createUnityInstance(canvas, config, (progress) => {
      progressBarFull.style.width = (progress * 100) + "%";
      say("LOADING... " + Math.round(progress * 100) + "%");
    })
      .then(() => { loadingBar.remove(); loadingText.remove(); })
      .catch((err) => { console.error(err); say("ERROR: " + err); });
  };
  script.onerror = () => say("ERROR: could not load " + script.src);
  document.body.appendChild(script);
}

/* ================= MAIN ================= */
(async () => {
  try {
    await dropOldCaches();

    // Ask Chrome not to evict the unpacked bundles under storage pressure -
    // otherwise a cleanup could force the whole 2.4 GB unpack to run again.
    if (typeof navigator !== "undefined" && navigator.storage && navigator.storage.persist) {
      try { await navigator.storage.persist(); } catch (e) { /* best effort */ }
    }

    if (await isUnpacked()) {
      say("LOADING FROM CACHE...");
    } else {
      await unpack();
    }
    say("STARTING GAME...");
    startUnity();
  } catch (err) {
    console.error(err);
    // multi-line diagnostics need to be legible at 48px cursive
    loadingText.style.fontSize = "15px";
    loadingText.style.fontFamily = "monospace";
    loadingText.style.whiteSpace = "pre-wrap";
    loadingText.style.textAlign = "left";
    say("ERROR: " + err.message);
  }
})();
</script>
  </body>
</html>
